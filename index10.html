<body>
<title>Planning Noël Saveurs Guérin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Agenda mensuel : 4 semaines (7 déc. → 3 janv.), une couleur par personne, vue liste sur téléphone */
:root {
  --bg: #f6f4f3; --surface: #ffffff; --ink: #241c18; --muted: #6d625c; --line: #e2dcd8; --out: #f1eeec;
  --accent: #7a3e1d; --hatch: #ebe6e3;
  --a: #0f766e; --a-bg: #d5f5ef; --a-ink: #0b4f4a;
  --b: #be185d; --b-bg: #fde4f0; --b-ink: #831843;
  --c: #6d28d9; --c-bg: #ece6fd; --c-ink: #4c1d95;
  --v: #b45309; --v-bg: #fdf0cf; --v-ink: #7a3a08;
  --g: #7a3e1d; --g-bg: #f3e4d9; --g-ink: #57290f;
  --on-dot: #ffffff;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-text: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161210; --surface: #1f1a17; --ink: #f1ebe7; --muted: #b3a8a1; --line: #362f2b; --out: #1a1613;
  --accent: #e8ad86; --hatch: #2a2421;
  --a: #2dd4bf; --a-bg: rgba(45,212,191,.15); --a-ink: #a7f3e8;
  --b: #f472b6; --b-bg: rgba(244,114,182,.15); --b-ink: #fbcfe8;
  --c: #c4b5fd; --c-bg: rgba(167,139,250,.17); --c-ink: #ddd6fe;
  --v: #fbbf24; --v-bg: rgba(251,191,36,.14); --v-ink: #fde68a;
  --g: #e8ad86; --g-bg: rgba(232,173,134,.16); --g-ink: #f6d5bf;
  --on-dot: #161210; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161210; --surface: #1f1a17; --ink: #f1ebe7; --muted: #b3a8a1; --line: #362f2b; --out: #1a1613;
  --accent: #e8ad86; --hatch: #2a2421;
  --a: #2dd4bf; --a-bg: rgba(45,212,191,.15); --a-ink: #a7f3e8;
  --b: #f472b6; --b-bg: rgba(244,114,182,.15); --b-ink: #fbcfe8;
  --c: #c4b5fd; --c-bg: rgba(167,139,250,.17); --c-ink: #ddd6fe;
  --v: #fbbf24; --v-bg: rgba(251,191,36,.14); --v-ink: #fde68a;
  --g: #e8ad86; --g-bg: rgba(232,173,134,.16); --g-ink: #f6d5bf;
  --on-dot: #161210; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 4vw, 38px); line-height: 1.05; margin: 4px 0 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 66ch; }

.tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.tabs button { font: inherit; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.lg { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px 4px 4px; border-radius: 999px; }
.lg.closed { padding-left: 10px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.dow { background: var(--surface); padding: 9px 10px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.day { background: var(--surface); min-height: 128px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.day.out { background: var(--out); }
.day.out .num { color: var(--muted); opacity: .55; }
.day.closed { background-image: repeating-linear-gradient(135deg, var(--hatch) 0 7px, transparent 7px 14px); }
.dhead { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.num { font-family: var(--f-display); font-weight: 800; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.num small { font-family: var(--f-text); font-weight: 600; font-size: 12px; color: var(--muted); margin-left: 4px; display: none; }
.dayh { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.events { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.chip { display: flex; align-items: center; gap: 7px; padding: 5px 8px 5px 5px; border-radius: 9px; min-width: 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: var(--on-dot); flex: none; }
.chip .txt { display: flex; flex-direction: column; min-width: 0; }
.chip .t { font-weight: 600; font-size: 12.5px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.chip .w { font-size: 11px; line-height: 1.25; opacity: .85; overflow-wrap: anywhere; }
.pa { background: var(--a-bg); color: var(--a-ink); } .pa .dot { background: var(--a); }
.pb { background: var(--b-bg); color: var(--b-ink); } .pb .dot { background: var(--b); }
.pc { background: var(--c-bg); color: var(--c-ink); } .pc .dot { background: var(--c); }
.pv { background: var(--v-bg); color: var(--v-ink); } .pv .dot { background: var(--v); }
.pg { background: var(--g-bg); color: var(--g-ink); } .pg .dot { background: var(--g); }
.shut { font-size: 12px; font-weight: 600; color: var(--muted); padding: 5px 8px; border-radius: 9px; background: var(--surface); border: 1px dashed var(--line); align-self: flex-start; }
.note-out { font-size: 11px; color: var(--muted); }

.people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; }
.card h3 .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.card .place { font-size: 12px; color: var(--muted); margin-top: -6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.weeks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.wk { border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 11px; color: var(--muted); background: var(--bg); }
.wk b { display: block; color: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
.cost { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.cost span { color: var(--muted); font-size: 12.5px; }
.cost b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.total { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.total .kv dt, .total .cost span, .total .place { color: inherit; opacity: .75; }
.total .cost { border-color: rgba(127,127,127,.35); }

.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
.rules h2 { font-family: var(--f-display); font-size: 17px; margin: 0 0 8px; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 92ch; }
.rules li::marker { color: var(--accent); }

@media (max-width: 780px) {
  .cal { grid-template-columns: minmax(0, 1fr); }
  .dow, .day.out { display: none; }
  .day { min-height: 0; flex-direction: row; align-items: flex-start; gap: 12px; padding: 10px 12px; }
  .dhead { flex-direction: column; align-items: flex-start; width: 84px; flex: none; gap: 3px; }
  .num small { display: inline; }
  .events { flex: 1; }
}
@media (prefers-reduced-motion: no-preference) { .tabs button { transition: background .15s, color .15s; } }
.day.wkout { display: none; }
@media print {
  .tabs { display: none; }
  .wrap { max-width: none; padding-block: 0; gap: 12px; }
  .day { min-height: 98px; }
  .rules { padding: 10px 14px; font-size: 12.5px; }
  .card, .rules, .day { break-inside: avoid; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Les Saveurs Guérin · Noël 2026</div>

</div>

  var START = new Date(2026, 11, 7);
  function iso(dt) { return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0"); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtH(h) { var e = Math.floor(h), m = Math.round((h - e) * 60); return e + " h" + (m ? " " + String(m).padStart(2, "0") : ""); }
  function euro(n) { return "≈ " + n.toLocaleString("fr-FR") + " €"; }
  function el(tag, cls, html) { var x = document.createElement(tag); if (cls) x.className = cls; if (html != null) x.innerHTML = html; return x; }
  function dot(k) { var d = el("span", "dot", k === "G" ? "★" : k); d.style.background = "var(" + P[k].color + ")"; return d; }

  function stats(k, places) {
    var evs = EV.filter(function (e) { return e.who === k && places.indexOf(e.place) >= 0; });
    var h = 0, days = {}, sundays = [], weeks = [0, 0, 0, 0, 0];
    evs.forEach(function (e) {
      h += e.h; days[e.d] = 1;
      var dt = parse(e.d), wi = Math.floor((dt - START) / 864e5 / 7);
      if (wi >= 0 && wi < 5) weeks[wi] += e.h;
      if (dt.getDay() === 0 && sundays.indexOf(e.d) < 0) sundays.push(e.d);
    });
    var sun = sundays.sort().map(function (s) { var d = parse(s); return d.getDate() + " " + MOIS[d.getMonth()]; });
    return { h: h, days: Object.keys(days).length, sun: sun.length ? sun.length + " (" + sun.join(", ") + ")" : "0", weeks: weeks };
  }

  function render(view) {
    var V = VIEWS[view];
    document.getElementById("title").textContent = V.title;
    document.getElementById("subtitle").textContent = V.sub;
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      b.setAttribute("aria-selected", b.dataset.view === view ? "true" : "false");
    });

    var lg = document.getElementById("legend"); lg.innerHTML = "";
    V.people.forEach(function (k) {
      var x = el("span", "lg " + P[k].cls); x.appendChild(dot(k)); x.appendChild(document.createTextNode(P[k].name)); lg.appendChild(x);
    });
    lg.appendChild(el("span", "lg closed", "Fermé"));

    var cal = document.getElementById("cal"); cal.innerHTML = "";
    DOW.forEach(function (d) { cal.appendChild(el("div", "dow", d)); });
    var per = PERIOD[view];
    for (var i = 0; i < 35; i++) {
      var dt = new Date(START); dt.setDate(START.getDate() + i);
      var key = iso(dt), wd = (dt.getDay() + 6) % 7;
      var evs = EV.filter(function (e) { return e.d === key && V.places.indexOf(e.place) >= 0; })
                  .sort(function (a, b) { return V.places.indexOf(a.place) - V.places.indexOf(b.place); });
      var closed = V.places.map(function (pl) {
        var c = CLOSED[pl] && CLOSED[pl][key];
        var inP = key >= PERIOD[pl][0] && key <= PERIOD[pl][1];
        return c && inP ? (view === "tout" ? LBL[pl] + " : " : "") + c : null;
      }).filter(Boolean);
      var inPeriod = key >= per[0] && key <= per[1];
      var cell = el("div", "day");
      if (!inPeriod && !evs.length && !closed.length) cell.classList.add("out");
      if (closed.length && !evs.length) cell.classList.add("closed");
      var head = el("div", "dhead"), num = el("div", "num", String(dt.getDate()));
      num.appendChild(el("small", null, DOWL[wd] + " " + MOIS[dt.getMonth()]));
      head.appendChild(num);
      var tot = evs.reduce(function (s, e) { return s + (e.who === "G" ? 0 : e.h); }, 0);
      if (tot) head.appendChild(el("div", "dayh", fmtH(tot) + " salariés"));
      cell.appendChild(head);
      var box = el("div", "events");
      evs.forEach(function (e) {
        var c = el("div", "chip " + P[e.who].cls); c.appendChild(dot(e.who));
        var t = el("span", "txt");
        t.appendChild(el("span", "t", e.t));
        t.appendChild(el("span", "w", (view === "tout" ? LBL[e.place] + " · " : "") + P[e.who].name + " · " + fmtH(e.h)));
        c.appendChild(t); box.appendChild(c);
      });
      closed.forEach(function (c) { box.appendChild(el("div", "shut", c)); });
      cell.appendChild(box);
      cal.appendChild(cell);
    }
    // Masquer les semaines entièrement hors période
    var cells = cal.querySelectorAll(".day");
    for (var w = 0; w < cells.length; w += 7) {
      var allOut = true;
      for (var j = w; j < w + 7; j++) { if (!cells[j].classList.contains("out")) { allOut = false; break; } }
      if (allOut) for (var j2 = w; j2 < w + 7; j2++) cells[j2].classList.add("wkout");
    }

    var pe = document.getElementById("people"); pe.innerHTML = "";
    var sum = 0, sumNet = 0, n = 0, labels = ["7 déc.", "14 déc.", "21 déc.", "28 déc.", "4 janv."];
    V.people.forEach(function (k) {
      var p = P[k], s = stats(k, V.places), c = el("article", "card");
      var h = el("h3"), sw = el("span", "sw"); sw.style.background = "var(" + p.color + ")";
      h.appendChild(sw); h.appendChild(document.createTextNode(p.name)); c.appendChild(h);
      c.appendChild(el("div", "place", p.place));
      c.appendChild(el("dl", "kv", "<dt>Heures</dt><dd>" + fmtH(s.h) + "</dd><dt>Jours</dt><dd>" + s.days +
        "</dd><dt>Dimanches</dt><dd>" + s.sun + "</dd>"));
      var w = el("div", "weeks");
      s.weeks.forEach(function (x, j) { w.appendChild(el("div", "wk", "<b>" + (x ? fmtH(x) : "–") + "</b>sem. " + labels[j])); });
      c.appendChild(w);
      if (p.cost) {
        c.appendChild(el("div", "cost", "<span>Coût total pour vous<br>net touché " + euro(p.net) + "</span><b>" + euro(p.cost) + "</b>"));
        sum += p.cost; sumNet += p.net; n++;
      } else {
        c.appendChild(el("div", "cost", "<span>Votre temps, sans coût en plus</span><b>—</b>"));
      }
      pe.appendChild(c);
    });
    if (n > 1) {
      var t = el("article", "card total");
      t.appendChild(el("h3", null, "Total salariés"));
      t.appendChild(el("div", "place", n + " contrats · médecine du travail en plus (≈ 100 € chacun)"));
      t.appendChild(el("dl", "kv", "<dt>Net versé</dt><dd>" + euro(sumNet) + "</dd>"));
      t.appendChild(el("div", "cost", "<span>Coût total pour vous</span><b>" + euro(sum) + "</b>"));
      pe.appendChild(t);
    }

    var ul = document.getElementById("rules"); ul.innerHTML = "";
    V.rules.forEach(function (r) { ul.appendChild(el("li", null, r)); });
    var cl = document.getElementById("cond"); cl.innerHTML = "";
    (V.cond || []).forEach(function (r) { cl.appendChild(el("li", null, r)); });
    document.getElementById("condbox").hidden = !(V.cond && V.cond.length);
    try { localStorage.setItem("planning-noel-vue", view); } catch (e) {}
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
    b.addEventListener("click", function () { render(b.dataset.view); });
  });
  var first = "saintes";
  try { var s = localStorage.getItem("planning-noel-vue"); if (s && VIEWS[s]) first = s; } catch (e) {}
  render(first);
})();
</script>

</body>
</html>
